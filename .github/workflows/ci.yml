# Orbit Rush CI/CD — single pipeline with staged jobs.
#
# Stage 1 (ci):   Typecheck
# Stage 2 (apk): Release APK with native AdMob test ads (depends on ci passing)
#
# The APK build runs `expo prebuild` + Gradle directly in the runner — no EAS,
# no Expo account, no secrets required. The ubuntu-latest runner already has
# Android SDK 35 + build-tools 35.0.0 pre-installed.
#
# To install the APK: download the artifact from a workflow run, transfer to
# your phone, and install it (enable "Install unknown apps"). Open the app →
# play until game over → tap "Revive Run" or "Double Shards" → a real Google
# test rewarded ad should render.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Stage 1: CI checks ──────────────────────────────────────────────
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

  # ── Stage 2: Release APK build (only on main, after CI passes) ─────
  apk:
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Xmx2g
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK to fixed filename
        run: |
          mkdir -p artifact
          cp android/app/build/outputs/apk/release/*.apk artifact/orbit-rush.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-rush-apk
          path: artifact/orbit-rush.apk
          retention-days: 30
